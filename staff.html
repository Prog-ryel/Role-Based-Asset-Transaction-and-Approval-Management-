<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory Staff Portal - Laboratory Asset System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">

    <div class="top-navbar">
        <div class="nav-brand">
            <div>
                <h1>Laboratory Staff Portal</h1>
                <div style="font-size: 11px; color: #ddd;">Operational Release, Return & Maintenance Processing</div>
            </div>
        </div>

        <div class="user-profile">
            <div class="user-info">
                <div id="welcome" class="user-name">Loading user...</div>
                <span class="user-role-badge role-staff">Laboratory Staff</span>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="nav-tabs" id="navTabs">

        <button class="tab-btn active" data-tab="tab-operations">Release & Returns</button>
        <button class="tab-btn" data-tab="tab-inventory">Inventory Status</button>
        <button class="tab-btn" data-tab="tab-equipment">Maintenance Controls</button>
    </div>

    <div id="systemAlert" class="alert alert-info hidden"></div>

    <div class="tab-content" id="tab-operations">
        <div class="card">
            <div class="card-header">
                <h3>Release & Return Transaction Processing</h3>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Borrower</th>
                            <th>Equipment</th>
                            <th>Current Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="operationsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="tab-content hidden" id="tab-inventory">
        <div class="card">
            <div class="card-header">
                <h3>Equipment Inventory Status</h3>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="tab-content hidden" id="tab-equipment">
        <div class="card">
            <div class="card-header">
                <h3>Maintenance Controls</h3>
            </div>
            <div class="form-group">
                <label for="maintenanceEqSelect">Select Equipment</label>
                <select id="maintenanceEqSelect"></select>
            </div>
            <div class="form-group">
                <label for="maintenanceStatusSelect">Set Status</label>
                <select id="maintenanceStatusSelect">
                    <option value="Available">Available</option>
                    <option value="Maintenance">Maintenance (BR-A4-09)</option>
                </select>
            </div>
            <button class="btn btn-warning btn-block" onclick="updateEquipmentMaintenance()">Update Equipment Status</button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
